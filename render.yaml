services:
  - type: web
    name: apartment-booking-api
    env: node
    region: oregon
    plan: free
    rootDir: server
    buildCommand: npm install && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: apartment-booking-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        sync: false   # Set this to your Vercel URL after deploying the frontend

databases:
  - name: apartment-booking-db
    databaseName: apartment_booking
    plan: free
